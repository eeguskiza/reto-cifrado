[package]
name = "quattro-crack"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Brute-force AES+MD5 cracker against a structured password space, CUDA-accelerated"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "quattro_crack"
path = "src/lib.rs"

[[bin]]
name = "quattro-crack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
