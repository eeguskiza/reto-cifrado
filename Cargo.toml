[package]
name = "quattro-crack"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Brute-force AES+MD5 cracker against a structured password space, CUDA-accelerated"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "quattro_crack"
path = "src/lib.rs"

[[bin]]
name = "quattro-crack"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cipher = "0.4"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-version-from-build-system", "dynamic-loading"] }
hex = "0.4"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "1"
toml = "0.8"

[build-dependencies]
anyhow = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
